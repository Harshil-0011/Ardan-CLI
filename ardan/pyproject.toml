[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ardan"
version = "0.1.0"
description = "Autonomous coding agent CLI using Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]",
    "rich",
    "httpx",
    "pyyaml",
    "ruff",
    "black",
    "beautifulsoup4",
    "prompt_toolkit",
    "cryptography",
    "Pillow",
    "watchdog",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
google = ["google-generativeai>=0.8.0"]
openai = ["openai>=1.50.0"]
mistral = ["mistralai>=1.0.0"]
groq = ["groq>=0.12.0"]
all = ["anthropic>=0.40.0", "google-generativeai>=0.8.0", "openai>=1.50.0", "mistralai>=1.0.0", "groq>=0.12.0"]

[tool.setuptools]
package-dir = {"" = "."}

[project.scripts]
ardan = "ardan.main:app"
